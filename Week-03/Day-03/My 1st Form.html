<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forms in Html</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Outline&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wdth,wght@0,87.5,100..900;1,87.5,100..900&display=swap" rel="stylesheet">
    <link href="Form.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form_area">
            <h2 style="color: #444444;">Form<span style="color: #E67E22;">Get</span></h2>
            <hr style="margin-top: 20px; margin-bottom: 40px;">
            <form action="get">
                <div class="input_area">
                    <label>Full Name :</label><br>
                    <input type="text" placeholder="Full Name" required>
                </div>
                <div class="input_area">
                    <label>Email :</label><br>
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input_area">
                    <label>Contact Number:</label><br>
                    <input type="number" placeholder="Contact Number" required>
                </div>
                <div class="input_area">
                    <label>Address</label><br>
                    <input type="text" placeholder="Address" required>
                </div>
                <div class="input_area" style="text-align: center; margin-top: 30px;">
                    <button class="mybtn" type="submit" value="Submit">Submit</button>
                </div>
                
            </form>
        </div>
    </div>
</body>
</html>
